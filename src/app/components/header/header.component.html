<div class="header">
    <div class="header-item hours-contact">
        <div class="header-items-list-sm" (click)="showMobileHoursPanel=true">
            <i class="fa fa-clock-o" aria-hidden="true"></i>
            HOURS/CONTACT
        </div>
        <div class="header-items-list">
            <div class="header-list-item">
                <a class="no-style header-link full" routerLink="/gifts">
                    <i class="fa fa-heart padded"></i>
                    DONATE
                </a>
            </div>
            <div class="header-list-item">
                <a class="no-style header-link full" routerLink="#">
                    <i class="fa fa-clock-o padded"></i>
                    HOURS
                </a>
            </div>
            <div class="header-list-item">
                <a class="no-style header-link full" routerLink="#">
                    <i class="fa fa-phone padded"></i>
                    CONTACT
                </a>
            </div>
            <div class="header-list-item social-media">
                <a class="no-style social-media-link" routerLink="https://www.facebook.com/spcaoftompkinscounty#" target="_blank">
                    <i class="fa fa-facebook-official" aria-hidden="true"></i>
                </a>
                <a class="no-style social-media-link" routerLink="https://x.com/SPCAofTC" target="_blank">
                    <i class="fa fa-twitter" aria-hidden="true"></i>
                </a>
                <a class="no-style social-media-link" routerLink="https://www.instagram.com/spcaoftompkinscounty/#" target="_blank">
                    <i class="fa fa-instagram" aria-hidden="true"></i>
                </a>
            </div>
        </div>
    </div>
    <a class="header-item no-style report-stray-container" routerLink="/tcac">
        <div class="report-stray">
            <i class="fa fa-exclamation-circle"></i>
            REPORT A STRAY <span class="animal">ANIMAL</span>
        </div>
    </a>
</div>

<spca-header-menu></spca-header-menu>
<spca-mobile-hours-panel *ngIf="showMobileHoursPanel" (closed)="showMobileHoursPanel=false"></spca-mobile-hours-panel>
