<div class="menu">
    <a routerLink="/">
        <img class="logo-img" src="assets/home/logo-spca.png">
        <img class="logo-img-sm" src="assets/home/logo-spca-sm.png">
    </a>

    <div class="menu-button-container" (click)="showMobileMenu = true">
        Menu
        <i class="fa fa-bars" aria-hidden="true"></i>
    </div>
    <div class="menu-items">
        <div class="menu-item" #adopt (click)="showNav('adopt', adopt)">
            ADOPT A PET
            <i class="fa fa-chevron-down" aria-hidden="true"></i>
        </div>
        <div class="menu-item" #supportUs (click)="showNav('support', supportUs)">
            SUPPORT US
            <i class="fa fa-chevron-down" aria-hidden="true"></i>
        </div>
        <div class="menu-item" #services (click)="showNav('services', services)">
            SPCA SERVICES
            <i class="fa fa-chevron-down" aria-hidden="true"></i>
        </div>
        <div class="menu-item" #involved (click)="showNav('get-involved', involved)">
            GET INVOLVED
            <i class="fa fa-chevron-down" aria-hidden="true"></i>
        </div>
    </div>
</div>

<spca-nav-panel *ngIf="selectedMenu" [selectedMenu]="selectedMenu" (closed)="hideNav()"></spca-nav-panel>
<spca-mobile-nav-menu *ngIf="showMobileMenu" (closed)="showMobileMenu = false"></spca-mobile-nav-menu>
